services:
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: mist-auth-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=8001
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-mist_super_secret_jwt_key_development_secret_32bytes}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-sqlite:///app/data/auth.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
    volumes:
      - auth_data:/app/app/data
    networks:
      - mist-network
    restart: unless-stopped

  store-service:
    build:
      context: ./services/store-service
      dockerfile: Dockerfile
    container_name: mist-store-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=8002
      - STORE_DATABASE_URL=${STORE_DATABASE_URL:-sqlite:///app/data/store.db}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:8001}
      - LIBRARY_SERVICE_URL=${LIBRARY_SERVICE_URL:-http://library-service:8003}
      - SOCIAL_SERVICE_URL=${SOCIAL_SERVICE_URL:-http://social-service:8004}
      - MARKET_SERVICE_URL=${MARKET_SERVICE_URL:-http://market-service:8005}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
    depends_on:
      - auth-service
      - market-service
    volumes:
      - store_data:/app/app/data
    networks:
      - mist-network
    restart: unless-stopped

  library-service:
    build:
      context: ./services/library-service
      dockerfile: Dockerfile
    container_name: mist-library-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=8003
      - LIBRARY_DATABASE_URL=${LIBRARY_DATABASE_URL:-sqlite:///app/data/library.db}
      - STORE_SERVICE_URL=${STORE_SERVICE_URL:-http://store-service:8002}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
    volumes:
      - library_data:/app/app/data
    depends_on:
      - store-service
    networks:
      - mist-network
    restart: unless-stopped

  social-service:
    build:
      context: ./services/social-service
      dockerfile: Dockerfile
    container_name: mist-social-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=8004
      - SOCIAL_DATABASE_URL=${SOCIAL_DATABASE_URL:-sqlite:///app/data/social.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-8.0}
    volumes:
      - social_data:/app/app/data
    networks:
      - mist-network
    restart: unless-stopped

  market-service:
    build:
      context: ./services/market-service
      dockerfile: Dockerfile
    container_name: mist-market-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=8005
      - MARKET_DATABASE_URL=${MARKET_DATABASE_URL:-sqlite:///app/data/market.db}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:8001}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
    depends_on:
      - auth-service
    volumes:
      - market_data:/app/app/data
    networks:
      - mist-network
    restart: unless-stopped

  ugc-service:
    build:
      context: ./services/ugc-service
      dockerfile: Dockerfile
    container_name: mist-ugc-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=8006
      - UGC_DATABASE_URL=${UGC_DATABASE_URL:-sqlite:///app/data/ugc.db}
      - UPLOADS_DIR=${UPLOADS_DIR:-data/uploads}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
    volumes:
      - ugc_data:/app/data
    networks:
      - mist-network
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: mist-gateway
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=8000
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:8001}
      - STORE_SERVICE_URL=${STORE_SERVICE_URL:-http://store-service:8002}
      - LIBRARY_SERVICE_URL=${LIBRARY_SERVICE_URL:-http://library-service:8003}
      - SOCIAL_SERVICE_URL=${SOCIAL_SERVICE_URL:-http://social-service:8004}
      - MARKET_SERVICE_URL=${MARKET_SERVICE_URL:-http://market-service:8005}
      - UGC_SERVICE_URL=${UGC_SERVICE_URL:-http://ugc-service:8006}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-mist_super_secret_jwt_key_development_secret_32bytes}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
    depends_on:
      - auth-service
      - store-service
      - library-service
      - social-service
      - market-service
      - ugc-service
    networks:
      - mist-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mist-frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Exposto apenas localmente caso deseje testar no home-server. O túnel acessará diretamente a porta 80 interna.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - gateway
    networks:
      - mist-network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mist-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - mist-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  auth_data:
    driver: local
  store_data:
    driver: local
  library_data:
    driver: local
  social_data:
    driver: local
  market_data:
    driver: local
  ugc_data:
    driver: local

networks:
  mist-network:
    driver: bridge

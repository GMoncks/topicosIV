services:
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: mist-auth-service
    ports:
      # Expõe apenas para localhost do host em desenvolvimento (não expõe na rede externa/LAN)
      - "127.0.0.1:${AUTH_SERVICE_PORT:-8001}:8001"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=8001
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-mist_super_secret_jwt_key_development_secret_32bytes}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-sqlite:///app/data/auth.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
    volumes:
      - auth_data:/app/app/data
    networks:
      - mist-network
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: mist-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=8000
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:8001}
      - STORE_SERVICE_URL=${STORE_SERVICE_URL:-http://store-service:8002}
      - LIBRARY_SERVICE_URL=${LIBRARY_SERVICE_URL:-http://library-service:8003}
      - SOCIAL_SERVICE_URL=${SOCIAL_SERVICE_URL:-http://social-service:8004}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-mist_super_secret_jwt_key_development_secret_32bytes}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
    depends_on:
      - auth-service
    networks:
      - mist-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mist-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - gateway
    networks:
      - mist-network
    restart: unless-stopped

volumes:
  auth_data:
    driver: local

networks:
  mist-network:
    driver: bridge

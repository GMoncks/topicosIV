server {
    listen 80;
    server_name localhost;

    # Permite uploads de até 100 MB para suportar capturas de tela em alta resolução e mods da Oficina
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_body_timeout 120s;

    # Cabeçalhos HTTP de segurança mandatórios (F4, F5)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Bloqueio estrito de arquivos ocultos/sensíveis (.env, .git, etc.) (F7)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Arquivos estáticos essenciais (F7)
    location = /robots.txt {
        root /usr/share/nginx/html;
        log_not_found off;
        access_log off;
    }

    location = /favicon.svg {
        root /usr/share/nginx/html;
        log_not_found off;
        access_log off;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        log_not_found off;
        access_log off;
    }

    # Assets estáticos com extensão: se não existirem, retorna 404 estrito (não o shell do SPA) (F7)
    location ~* \.(?:css|js|map|jpe?g|png|gif|ico|svg|webp|woff2?|json)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }


    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts estendidos e desativação de buffering para uploads fluidos
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }

    location /ws/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}